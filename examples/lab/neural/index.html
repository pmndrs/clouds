<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neural clouds — feature pass</title>
<style>
html,body{margin:0;background:#111;color:#ddd;font:13px/1.3 system-ui,sans-serif;overflow:hidden}
#wrap{position:relative;width:1536px;height:1536px}
canvas{display:block;width:1536px;height:1536px;cursor:grab}
#review{position:fixed;right:6px;top:6px;padding:6px 8px;background:rgba(0,0,0,.7);display:flex;flex-direction:column;gap:2px}

.label{position:absolute;padding:3px 6px;background:rgba(0,0,0,.6);pointer-events:none;white-space:pre}
#status{position:absolute;right:6px;bottom:6px;padding:3px 6px;background:rgba(0,0,0,.6);pointer-events:none}
</style></head>
<body><div id="wrap"><canvas id="c" width="1536" height="1536"></canvas><div id="review"><b>Review</b></div><div id="status">loading</div></div>
<script type="module" src="./main.ts"></script></body></html>
