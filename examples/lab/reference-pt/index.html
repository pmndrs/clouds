<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clouds - PT reference</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px/1.35 ui-monospace,Menlo,monospace;color:#fff}
#app{position:fixed;inset:0}
#app canvas,#pt{position:fixed;inset:0;display:block;width:100%;height:100%}
#hud{position:fixed;left:8px;top:8px;padding:6px 8px;background:#0009;border-radius:4px;white-space:pre;pointer-events:none;z-index:2}
#panel{position:fixed;right:8px;top:8px;padding:8px;background:#0009;border-radius:4px;display:grid;gap:6px;z-index:2}
#panel .row{display:flex;flex-wrap:wrap;gap:4px}
#panel button,#panel input,#panel select{font:inherit;background:#222;color:#fff;border:1px solid #555;border-radius:3px;padding:2px 5px;cursor:pointer}
#panel input{width:70px}
#panel button.on{background:#357}
</style></head>
<body><div id="app"></div><canvas id="pt"></canvas><div id="hud"></div><div id="panel"></div><script type="module" src="./main.ts"></script></body></html>
