<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clouds - compare</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px/1.35 ui-monospace,Menlo,monospace;color:#fff}
#stack{position:fixed;inset:0;display:flex;flex-direction:column;gap:2px;background:#111}
#stack.cols{flex-direction:row}
.pane{position:relative;flex:1 1 0;min-width:0;min-height:0;overflow:hidden;background:#000}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.label{position:absolute;left:8px;bottom:8px;margin:0;padding:3px 7px;background:#000a;border-radius:3px;pointer-events:none;white-space:pre}
.label b{font-weight:600}
#overlay{position:fixed;inset:0;touch-action:none}
#bar{position:fixed;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:70vw}
#bar button,#bar label{background:#000a;color:#fff;border:1px solid #fff4;border-radius:3px;padding:2px 7px;font:inherit}
#bar label{display:flex;gap:5px;align-items:center}
#bar input[type=range]{width:90px}
#msg{position:fixed;left:8px;top:8px;margin:0;padding:3px 7px;background:#000a;border-radius:3px;pointer-events:none;white-space:pre}
.hidden{display:none!important}
</style></head>
<body><div id="stack"></div><div id="overlay"></div><div id="bar"></div><pre id="msg"></pre><script type="module" src="./main.ts"></script></body></html>
