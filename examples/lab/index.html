<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clouds — Lab index</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #11191e; color: #eaf0f2; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .index { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
    .index h1 { font-weight: 450; font-size: 29px; letter-spacing: -1px; margin: 8px 0; }
    .index p { color: #a7b8c0; font-size: 13px; line-height: 1.6; }
    .index .eyebrow { font-size: 10px; letter-spacing: .17em; color: #80c8c1; text-transform: uppercase; font-weight: 650; }
    .index h2 { font-size: 12px; letter-spacing: .04em; font-weight: 600; margin: 28px 0 4px; color: #c4d1d7; }
    .index ul { list-style: none; padding: 0; margin: 0 0 28px; }
    .index li { padding: 8px 0; border-bottom: 1px solid #314048; }
    .index a { color: #9edbd1; }
    .index .note { color: #7d9199; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
