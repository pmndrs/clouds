<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clouds - Decima parity</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px/1.35 ui-monospace,Menlo,monospace;color:#fff}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:8px;top:8px;padding:6px 8px;background:#0009;border-radius:4px;white-space:pre;pointer-events:none}
#panel{position:fixed;right:8px;top:8px;max-height:calc(100vh - 16px);overflow-y:auto;overflow-x:hidden;padding:8px;background:#000a;border-radius:4px;display:grid;gap:5px;width:min(250px,calc(100vw - 16px));box-sizing:border-box;z-index:6}
#panel .sec{margin-top:6px;color:#8fb0dd;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
#panel .row{display:flex;flex-wrap:wrap;gap:4px}
#panel .row>select{flex:1 1 0;width:0;min-width:0}
#panel .row>button{flex:none}
#showui{position:fixed;right:8px;top:8px;display:none;z-index:6;font:inherit;background:#222c;color:#fff;border:1px solid #555;border-radius:3px;padding:2px 6px;cursor:pointer}
#help{position:fixed;right:270px;top:8px;max-width:340px;padding:8px 10px;background:#000c;border-radius:4px;z-index:6}
#panel label{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:6px}
#panel button,#panel select{font:inherit;background:#222;color:#fff;border:1px solid #555;border-radius:3px;padding:2px 5px;cursor:pointer}
#panel button.on,#panel select.on{background:#357}

#refimg{position:fixed;pointer-events:none;object-fit:fill;display:none}
#divider{position:fixed;width:22px;cursor:ew-resize;display:none;z-index:5;touch-action:none}
#divider::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:#ffd166}
#divider.overlay::before{background:repeating-linear-gradient(#ffd166 0 6px,transparent 6px 12px)}
#divider::after{content:"⇔";position:absolute;left:0;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:#ffd166;color:#111;font:bold 13px/22px system-ui;text-align:center}
#panel input[type=range]{width:100%}
</style></head>
<body><div id="app"></div><div id="hud"></div><div id="panel"></div><script type="module" src="./main.ts"></script></body></html>
