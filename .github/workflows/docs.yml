name: Build documentation and deploy to GitHub Pages
on:
  push:
    branches: ['main']
  workflow_dispatch:

# Cancel previous run (see: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: pmndrs/docs/.github/workflows/build.yml@v3
    with:
      mdx: 'docs/guide'
      libname: 'Clouds'
      libname_short: 'clouds'
      home_redirect: '/getting-started'
      icon: '☁️'
      # The repository URL is not final: change it here and in GITHUB_BASE in scripts/check-docs.mjs
      # (the guide's links to source files carry it too; the check verifies them against the checkout).
      github: 'https://github.com/pmndrs/clouds'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
